name: Desktop checks and packages
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      validate_artifacts_run:
        description: "Validate release assets from a successful run ID (no publication)"
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  desktop:
    if: github.event_name != 'workflow_dispatch' || inputs.validate_artifacts_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs check-version "$RELEASE_TAG"
        shell: bash
      - name: Test release preparation and publishing
        run: node --test scripts/test-release.mjs
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt,clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: node scripts/prepare-worker.mjs
      - run: npm run notices
      - run: npm run test:licenses
      - run: npm run check
      - run: npm run test:render
      - run: npm run test:i18n
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: squeeze-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/
            third-party/
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    needs: desktop
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: squeeze-*
          path: release-artifacts
      - name: Upload installers and checksums, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs publish "$RELEASE_TAG" release-artifacts release-assets
  validate-release:
    name: Validate release assets
    if: github.event_name == 'workflow_dispatch' && inputs.validate_artifacts_run != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/test-release.mjs
      - uses: actions/download-artifact@v8
        with:
          pattern: squeeze-*
          path: release-artifacts
          run-id: ${{ inputs.validate_artifacts_run }}
          github-token: ${{ github.token }}
      - name: Prepare installers and checksums
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/release.mjs prepare "v$VERSION" release-artifacts release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: release-preview
          path: release-assets/
          if-no-files-found: error
